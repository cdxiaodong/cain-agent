tasks:
  - description: >
      修复 tests/test_tencent_cam.py 中剩余的失败测试。可以同时修改源码和测试文件。
      
      已知问题1（源码bug）：src/cain_agent/cloud/tencent_cam.py 的 _extract_policy_actions 方法。
      get_policy_version() 返回 result.get("Data")，即 {"PolicyVersion": {"PolicyDocument": "..."}}。
      但 _extract_policy_actions 调用 policy_data.get("PolicyDocument")，这里 policy_data 是
      {"PolicyVersion": {...}}，PolicyDocument 嵌在 PolicyVersion 里面。
      修复：改为 policy_data.get("PolicyVersion", {}).get("PolicyDocument")。
      
      已知问题2（测试mock数据bug）：测试中 ListAttachedUserPolicies 的 mock 数据格式不一致。
      _call_api 的真实实现返回 resp.json().get("Response", {})，即已经剥离了 Response 外壳。
      但测试中部分 mock 数据（admin_attached、privesc_attached 等局部变量）包含了额外的 "Response" 包装。
      ListUsers 正确地用了 sample_user_list["Response"]（已剥离），
      但 ListAttachedUserPolicies 用了 admin_attached（未剥离，仍含 Response）。
      修复：在测试的 api_responses 中，将 "ListAttachedUserPolicies": admin_attached 
      改为 "ListAttachedUserPolicies": admin_attached["Response"]，
      或者将 admin_attached 定义时不加 "Response" 外壳。
      
      验证：python3 -m pytest tests/test_tencent_cam.py -v，确保全部通过。
    expected_output: >
      tests/test_tencent_cam.py 全部测试通过（0 failed）。
    agent: cloud_engineer

  - description: >
      修复 tests/test_article2_format.py 中 3 个失败的测试。
      这些测试检查了文章中不存在的结构，需要调整测试以匹配实际文章内容。
      
      失败1 test_has_closing_section：测试检查文章是否有结尾部分（如"总结"等关键词）。
      读取 docs/articles/02-validation-loop-deep-dive.md，检查实际结尾内容，
      调整测试的匹配模式以匹配文章实际的结尾部分。
      
      失败2 test_frontmatter_like_section：测试检查文章是否有 YAML frontmatter（---分隔符）
      或元数据区域。文章可能没有 YAML frontmatter，这是正常的。
      如果文章确实没有 frontmatter，应放宽这个测试或跳过。
      
      失败3 test_no_broken_markdown_links：测试的 markdown 链接检测正则匹配到了
      JSON 代码块中的方括号 [ ]，产生了误报。
      修复：在检测前先移除代码块内容（```...```之间的内容），只检测正文中的链接。
      
      先用 read_file 读取 docs/articles/02-validation-loop-deep-dive.md 和 
      tests/test_article2_format.py 了解实际内容，再修复。
      验证：python3 -m pytest tests/test_article2_format.py -v，确保全部通过。
    expected_output: >
      tests/test_article2_format.py 全部测试通过（0 failed）。
    agent: doc_engineer

