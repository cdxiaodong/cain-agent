name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: toolchain/pi/package-lock.json
      - name: Install pi bridge dependencies
        working-directory: toolchain/pi
        run: npm ci
      - name: Install
        run: pip install -e ".[dev,cloud]"
      - name: Ruff
        run: ruff check src tests
      - name: Pyright (non-blocking, known baseline errors tracked separately)
        continue-on-error: true
        run: pyright
      - name: Pytest
        run: pytest -q
