[project]
name = "cain-agent"
version = "0.2.0"
description = "Real-world AI Penetration Testing Engineer — authorized security assessments with a built-in cloud module"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "pyyaml>=6.0",
    "oss2>=2.18",
    "requests>=2.28",
]

[project.optional-dependencies]
cloud = [
    "boto3>=1.34",
    "kubernetes>=28.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
cain-agent = "cain_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src", "tests"]
# bench/ 不在 include(不进检查面),但 tests 经 sys.path.insert 导入其中模块
# (local_finding_fixture / run_benchmark 等);extraPaths 让静态解析与运行时一致。
extraPaths = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
