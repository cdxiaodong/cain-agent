# =============================================================================
# scope.yaml  —  Cain 授权目标白名单（Scope 硬约束）
# =============================================================================
#
# ⚠️  法律与红线声明（使用前必读）
#   1. 仅限对【自有资产】或【已获得书面授权】的目标进行测试。
#   2. 未获授权的任何目标一律视为越权，平台按默认拒绝处理。
#   3. 你须为所列目标的合法性独自承担责任；工程层只负责按本清单强制校验，
#      不替任何使用者承担法律后果。
#   4. 范围一经确定请收紧到最小必要集合，禁止整网/整域放行（除非确有授权）。
#
# -----------------------------------------------------------------------------
# 工作原理
#   - 加载时即校验格式，非法条目直接报错，拒绝启动。
#   - 判定顺序：先 out_of_scope（拒绝优先），再 in_scope；两者都不中 → 默认拒绝。
#   - 匹配语义（见 src/cain_agent/scope.py）：
#       * 裸域名  example.com        命中自身及所有子域（a.example.com 等）。
#       * 通配域  "*.example.com"    仅命中子域，不命中裸域 example.com 本身。
#       * 裸 IP    10.1.2.3           等价于 10.1.2.3/32（单个主机）。
#       * CIDR    10.0.0.0/24        整个网段；授权要求【完全包含】，拒绝只要【有交集】。
#   - 通配符在 YAML 里以 `*` 开头，必须加引号，否则会被当成 YAML 别名解析失败。
# -----------------------------------------------------------------------------

# 授权范围内（allow list）——只把真正允许测试的目标放这里
in_scope:
  # --- 域名 / 通配域名 ---
  - app.target-corp.com          # 裸域名：命中自身与全部子域
  - "*.api.target-corp.com"      # 通配：仅 *.api.target-corp.com 的子域
  # --- IP / CIDR 网段 ---
  - 203.0.113.10                 # 单台主机（等价 /32）
  - 198.51.100.0/24              # 整个 /24 网段
  - 2001:db8:1::/48              # IPv6 网段

# 明确排除（deny list）——即便落在 in_scope 的更宽范围内也一律拒绝
out_of_scope:
  - admin.app.target-corp.com    # 生产管理后台：永不触碰
  - 198.51.100.128/25            # 该 /25 属核心区，即便上层 /24 已授权也排除
  - mail.target-corp.com         # 邮件服务：易触发告警，单独剔除

# 复制本文件为 scope.yaml（项目根或环境变量指向的路径），按实际授权改写后启用。
# 任何不在 in_scope 中的目标，ScopeGuardHook 会在 PreToolUse 阶段直接阻断。
